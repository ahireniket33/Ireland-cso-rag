name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      RAG_LOG_LEVEL: ERROR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check src tests run.py scripts
      - name: Build pipeline (offline sample) + run tests
        run: |
          python run.py --config config.test.yaml pipeline
          pytest --cov=rag --cov-report=term-missing
      - name: RAG evaluation suite
        run: python run.py --config config.test.yaml eval

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ireland-cso-rag:ci .
