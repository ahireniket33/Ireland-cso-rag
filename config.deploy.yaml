# Deployment config (Hugging Face Space): neural MiniLM embeddings + numpy
# store + extractive generator over the bundled, deterministic CSO sample.
# numpy store = trivial, robust file persistence (no DB/permission quirks).
# No API key and no runtime network needed -> reliable on free tier.
project:
  name: ireland-cso-rag
  domain: Irish economic & census statistics (CSO.ie)
  domain_keywords:
  - ireland
  - irish
  - cso
  - census
  - population
  - inflation
  - cpi
  - consumer price
  - unemployment
  - employment
  - prices
  - economy
  - economic
  - county
  - dublin
  - statistic
  - rate
  - index
  - household
  - earnings
  - wages
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  sample_dir: data/sample
  chunks_file: data/processed/chunks.jsonl
  vector_dir: data/processed/vectorstore
ingest:
  source: cso_pxstat
  offline: true
  base_url: https://ws.cso.ie/public/api.restful/PxStat.Data.Cube_API.ReadDataset
  datasets:
  - code: CPM01
    title: Consumer Price Index
    topic: prices
  - code: MUM01
    title: Monthly Unemployment
    topic: labour market
  - code: FY001A
    title: Census Population
    topic: census
  min_year: 2015
  request_timeout_s: 30
  request_retries: 3
  request_backoff_s: 2.0
chunk:
  strategy: recursive
  size: 600
  overlap: 100
  min_chars: 40
embeddings:
  backend: sentence_transformers
  model: sentence-transformers/all-MiniLM-L6-v2
  dim: 384
  batch_size: 64
  normalize: true
vectorstore:
  backend: numpy
  collection: cso_chunks
  distance: cosine
retrieval:
  top_k: 5
  similarity_threshold: 0.3
  rerank:
    enabled: false
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    top_n: 5
generation:
  backend: extractive
  max_context_chunks: 5
  temperature: 0.0
  max_tokens: 512
  openai:
    model: gpt-4o-mini
    request_timeout_s: 30
guardrails:
  refusal_message: I don't have enough information to answer that from the Irish CSO
    statistics I have.
  max_query_chars: 500
  enable_input_guard: true
  enable_pii_filter: true
  enable_output_grounding: true
  faithfulness_threshold: 0.5
api:
  host: 0.0.0.0
  port: 8000
  request_timeout_s: 60
eval:
  gold_file: src/rag/eval/gold_qa.yaml
  retrieval_relevance_min: 0.6
  faithfulness_min: 0.6
logging:
  level: INFO
